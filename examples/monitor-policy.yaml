version: 1
default: challenge
trusted_proxies:
  - 10.0.0.0/8
  - 127.0.0.1
adapters:
  anubis:
    forwarded_header: X-Real-IP
  caddy:
    forwarded_header: X-Forwarded-For
  nginx:
    forwarded_header: X-Forwarded-For
rules:
  - name: allow health monitor
    action: allow
    match:
      client_ip: ["dns:monitor.internal"]
      path: ["/health"]
      methods: [GET]
  - name: block private admin
    action: block
    match:
      path: ["/admin/*"]
      headers:
        X-Rehearsal-Role: anonymous
cases:
  - name: monitor-via-proxy
    request:
      remote_ip: 10.2.0.8
      method: GET
      path: /health
      headers:
        X-Forwarded-For: 203.0.113.42
        X-Real-IP: 203.0.113.42
    dns:
      monitor.internal: [203.0.113.42]
    expect:
      anubis: allow
      caddy: allow
      nginx: allow
  - name: spoofed-forwarded-ip
    request:
      remote_ip: 198.51.100.9
      method: GET
      path: /health
      headers:
        X-Forwarded-For: 203.0.113.42
        X-Real-IP: 203.0.113.42
    dns:
      monitor.internal: [203.0.113.42]
    expect:
      anubis: challenge
      caddy: challenge
      nginx: challenge
  - name: anonymous-admin
    request:
      remote_ip: 198.51.100.9
      method: GET
      path: /admin/settings
      headers:
        X-Rehearsal-Role: anonymous
    expect:
      anubis: block
      caddy: block
      nginx: block
