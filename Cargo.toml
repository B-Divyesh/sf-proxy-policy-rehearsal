[package]
name = "proxy-policy-rehearsal"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Rehearse reverse-proxy allow, challenge, and block policy locally"
repository = "https://github.com/B-Divyesh/sf-proxy-policy-rehearsal"
readme = "README.md"
include = [
  "/src/**",
  "/tests/**",
  "/docs/**",
  "/examples/**",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md"
]

[[bin]]
name = "ppr"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.47", features = ["derive"] }
ipnet = { version = "2.11.0", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_yaml = "0.9.34"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.21.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
